name: Publish Wiki (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Push Architecture page to wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT_B64: ""
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          echo "$CONTENT_B64" | base64 -d > wiki/Architecture.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Architecture.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Architecture page"
            git push
          fi
